[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bugle"
version = "0.1.0"
description = "Local-first personal announcement / journal board for macOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
]

[project.scripts]
bugle = "bugle.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bugle"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]